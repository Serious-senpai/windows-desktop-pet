name: Lint

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  rustfmt:
    name: Run rustfmt
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-05-01
          components: rustfmt
          cache: false
          rustflags: ""

      - name: Run rustfmt via cargo fmt
        run: cargo +nightly-2026-05-01 fmt -- --check

  clippy:
    name: Run clippy
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96
          components: clippy
          cache: false
          rustflags: ""

      - name: Run clippy
        run: cargo clippy --all-features --no-deps -- -D warnings
